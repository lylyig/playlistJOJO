<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour toi 💗</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #fce4ec;
            padding: 50px 20px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 25px;
        }

        h1 {
            color: #d81b60;
        }

        p {
            color: #555;
        }

        audio {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>🎧 Pour toi</h1>
        <p>Une petite playlist rien que pour toi 💗</p>

        <audio id="player" controls>
            <source src="plA-01.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        const tracks = [
            "plA-01.mp3",
            "plB-01.mp3",
            "plA-02.mp3",
            "plB-02.mp3",
            "plA-03.mp3",
            "plB-03.mp3",
            "plA-04.mp3",
            "plB-04.mp3"
        ];

        let current = 0;
        const player = document.getElementById("player");

        player.addEventListener("ended", () => {
            current++;

            if (current < tracks.length) {
                player.src = tracks[current];
                player.play();
            }
        });
    </script>

</body>
</html>
